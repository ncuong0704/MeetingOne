name: Code quality and recovery tests

on:
  pull_request:
  push:
    branches: [main, devtest]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check -p meetingone --lib --locked
      - run: cargo clippy -p meetingone --lib --locked
      - name: Use bundled FFmpeg for generated audio fixtures
        shell: pwsh
        run: |
          Copy-Item -LiteralPath frontend/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -Destination "$env:RUNNER_TEMP/ffmpeg.exe"
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test persistence and shutdown without microphones
        shell: pwsh
        run: |
          $filters = @('database::', 'audio::recording_', 'audio::incremental_saver::tests', 'audio::meeting_folder::tests', 'audio::audio_processing::meeting_folder_tests', 'audio::capture::backend_config::tests', 'capu_engine::live_finalize::tests')
          foreach ($filter in $filters) {
            cargo test -p meetingone --lib --locked $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
