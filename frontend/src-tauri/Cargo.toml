[package]
name = "meetingone"
version = "0.3.0"
description = "A Tauri App for meeting minutes"
authors = ["Cuong Nguyen"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[features]
default = []
# Enables the CUDA execution provider for the `ort`-backed engines (CAPU punctuation
# restoration and the ROVER RNNT decoder). Falls back to CPU automatically at runtime if
# the CUDA/cuDNN libraries required by ONNX Runtime aren't present on the machine — see
# `capu_engine::capu_engine::CapuEngine::load` and `rnnt_decoder::sessions::load_session`.
# Does NOT affect the primary sherpa-onnx ASR engine (single-model live/file path), which
# has no GPU build available through its Rust crate's automatic download mechanism.
#
# `dep:ort-sys` forces Cargo to fully run ort-sys's own build script (which copies its own,
# version-mismatched onnxruntime dylibs into target/{profile}/) before this crate's build
# script runs. Without that ordering edge, Cargo is free to run the two build scripts in
# either order, and whichever's dylib copy lands last wins — a real race on a clean build.
# Our build script (build/onnxruntime_gpu.rs) always runs last and overwrites with the
# correct official GPU dylibs, guaranteeing the final result regardless of ort-sys's copy.
cuda = ["ort/cuda", "ort/load-dynamic", "dep:ort-sys"]
vulkan = []
metal = []

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
which = "6.0.1"
zip = "2.2"           # ZIP extraction (Windows, macOS)
tar = "0.4"           # TAR extraction (Linux)
xz2 = "0.1"           # XZ decompression (Linux)
# Not used directly from build.rs — listed only to give our GPU-dylib fix build script
# (build/onnxruntime_gpu.rs) an explicit ordering edge against ort-sys's own build script.
# This does NOT fully eliminate the race (Cargo's resolver still builds a second,
# separately-featured ort-sys instance for the regular dependency graph — see the comment
# at the top of build/onnxruntime_gpu.rs), so that script also self-heals on every build
# rather than relying on ordering alone. Features MUST match what `ort`'s
# `cuda`/`load-dynamic`/default features resolve to for ort-sys (cuda, load-dynamic,
# download-binaries, copy-dylibs), or this becomes a third, useless ort-sys instance.
ort-sys = { version = "=2.0.0-rc.10", optional = true, features = ["cuda", "load-dynamic", "download-binaries", "copy-dylibs"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
# Cross-platform audio capture
cpal = "0.15.3"

# Wav encoding - now using manual WAV creation instead of hound
# hound = "3.5"

# Cli ! shouldn't be required if using as lib
clap = { version = "4.3", features = ["derive"] }

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"
which = "6.0.1"

# Bytes
bytemuck = "1.16.1"

# EBU R128 loudness normalization (professional broadcast standard)
ebur128 = "0.1"

# Noise suppression - RNNoise-based neural network noise reduction
nnnoiseless = "0.5"

# Speech recognition and async utilities
futures-util = "0.3"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }

# ZipFormer Vietnamese ASR via sherpa-onnx
sherpa-onnx = "1.13.0"

# Vietnamese ITN (inverse text normalization) via OpenFST FAR files
arcweight = "0.3"

# CAPU (punctuation + capitalization restoration) via ONNX Runtime
# Pinned to rc.10 (not the newer rc.13) because the existing `silero_rs` git
# dependency already pins `ort = "=2.0.0-rc.10"` for VAD — Cargo can't resolve
# two versions of the same crate. Verified the API this plan uses is identical
# between rc.10 and rc.13.
ort = "2.0.0-rc.10"
tokenizers = "0.23"
kaldi-native-fbank = "0.1"
similar = "3"
unicode-normalization = "0.1"
sentencepiece-model = "0.1"

thiserror = "2.0.16"

# Async
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-util = "0.7"  # Utilities for tokio including CancellationToken
async-trait = "0.1"  # Trait abstraction for async methods

reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }

# crossbeam
crossbeam = "0.8.4"
dashmap = "6.1.0"
parking_lot = "0.12"

# Directories
dirs = "5.0.1"

# Additional dependencies for notification system
url = "2.5.0"


# System monitoring for resource management
sysinfo = "0.32"

lazy_static = { version = "1.4.0" }
realfft = "3.4.0"
regex = "1.11.0"
docx-rs = "0.4.17"
pdf-extract = "0.12.0"
zip = "2.2"
ndarray = "0.16"
bytes = { version = "1.9.0", features = ["serde"] }

esaxx-rs = "0.1.10"
symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
rand = "0.8.5"
rayon = "1.10"
rubato = "0.15.0"
ringbuf = "0.4.8"
tempfile = "3.3.0"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }

sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }

# Common Tauri configuration
tauri = { version = "2.6.2", features = [ "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-process = "2.3.0"
tauri-plugin-updater = "2.10.1"
base64 = "0.22.1"

# macOS-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.6.2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
once_cell = "1.17.1"
objc = "0.2.7"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }
anyhow = "1.0"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
core-graphics = "0.23"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
dasp = "0.11.0"
futures-channel = "0.3.31"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
futures-channel = "0.3.31"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
futures-channel = "0.3.31"

[dev-dependencies]
tempfile = "3.3.0"
infer = "0.15"
criterion = { version = "0.5.1", features = ["async_tokio"] }
memory-stats = "1.0"
strsim = "0.10.0"
futures = "0.3.31"
tracing-subscriber = "0.3.16"

[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
esaxx-rs = { git = "https://github.com/thewh1teagle/esaxx-rs.git", branch = "feat/dynamic-msvc-link" }
